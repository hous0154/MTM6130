        <h2>Five HTML Tags I Learned</h2>

        <dl>
            <dt>&lt;p&gt;</dt>
            <dd>Defines a paragraph of text.</dd>

            <dt>&lt;h1&gt;</dt>
            <dd>Defines the main heading on a page.</dd>

            <dt>&lt;em&gt;</dt>
            <dd>Emphasizes text, usually displayed in italics.</dd>

            <dt>&lt;abbr&gt;</dt>
            <dd>Identifies an abbreviation.</dd>

            <dt>&lt;sup&gt;</dt>
            <dd>Displays text as superscript, slightly above the normal line.</dd>
        </dl>
    </main>
